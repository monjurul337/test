org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# android.enableJetifier removed: the Flutter 3.35 template drops
# it (all dependencies are AndroidX-native) and AGP 8.9+ retires it.
# Resilience against flaky artifact downloads in CI (a 504 from a
# Maven redirect killed the 2026-11-09 build): retry dependency
# resolution instead of failing the whole build on one timeout.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
