plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.geminihd.studio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Java 17 (was 1.8): GeckoView's libraries target 11+/17.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Compress the GeckoView native libs in the APK (libxul is big).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.geminihd.studio"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk 26 (was flutter.minSdkVersion 21): GeckoView's floor.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // GeckoView ships per-ABI; arm64-v8a only keeps the APK sane
        // (64-bit phones; the plain multi-ABI AAR would add ~200 MB).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

// Kotlin >= 2.3 rejects the old kotlinOptions { jvmTarget } DSL —
// the compilerOptions form is the current one (same fix the AI
// Image Studio source's patch script applies).
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Built-in Firefox engine for the Google (Gemini) sign-in +
    // image-search screens: Google blocks sign-in inside Android
    // WebView; GeckoView is a full browser engine, and its built-in
    // extension hands the session cookies back to the app after
    // sign-in. Version aligned with the source app: GeckoView 152
    // (fits this project's AGP 8.9 / compileSdk 36 stack).
    implementation "org.mozilla.geckoview:geckoview-arm64-v8a:152.0.20260713164047"
}
