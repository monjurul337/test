plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.geminihd.studio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Java 17 (was 1.8): GeckoView 128's libraries target 11+/17.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    // Compress the GeckoView native libs in the APK (libxul is big).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.geminihd.studio"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk 26 (was flutter.minSdkVersion 21): GeckoView's floor.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // GeckoView ships per-ABI; arm64-v8a only keeps the APK sane
        // (64-bit phones; the plain multi-ABI AAR would add ~200 MB).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys so release APK is ready to install directly.
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Built-in Firefox engine for the Google (Gemini) sign-in screen:
    // Google blocks sign-in inside Android WebView; GeckoView is a
    // full browser engine, and its built-in extension hands the
    // session cookies back to the app after sign-in. Version pinned
    // to the Firefox 128 line, contemporary with this project's
    // AGP 8.1 / Gradle 8.3 / compileSdk 34 stack (verified on
    // maven.mozilla.org 2026-11-09).
    implementation "org.mozilla.geckoview:geckoview-arm64-v8a:128.0.20240725162350"
}
