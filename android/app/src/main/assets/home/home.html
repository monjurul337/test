<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sotizence Play Books Browser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    background: #080c14;
    background-image: 
      radial-gradient(circle at 50% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 60%),
      radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 15% 75%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 18px 40px;
    user-select: none;
    overflow-x: hidden;
    position: relative;
    color: #f8fafc;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    opacity: 0.6;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 440px;
    width: 100%;
  }

  /* Logo */
  .logo-wrap {
    position: relative;
    width: 76px;
    height: 76px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-aura {
    position: absolute;
    inset: -10px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.5) 0%, rgba(139, 92, 246, 0.3) 50%, transparent 70%);
    border-radius: 50%;
    filter: blur(14px);
    opacity: 0.85;
    animation: auraPulse 4s ease-in-out infinite alternate;
  }

  @keyframes auraPulse {
    from { transform: scale(0.92); opacity: 0.65; }
    to { transform: scale(1.15); opacity: 0.95; }
  }

  .app-logo {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55));
  }

  .title-text {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
    text-align: center;
  }

  .badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #a5b4fc;
    margin-bottom: 26px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }

  /* Search Pill */
  .search-wrap {
    width: 100%;
    margin-bottom: 32px;
  }

  .search-form {
    display: flex;
    align-items: center;
    background: rgba(16, 24, 40, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 9999px;
    padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    transition: all 0.25s ease;
  }

  .search-form:focus-within {
    border-color: #6366f1;
    background: rgba(20, 30, 52, 0.98);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 14px 40px rgba(0, 0, 0, 0.6);
  }

  .google-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    flex: none;
  }

  .search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    color: #f8fafc;
    background: transparent;
  }

  .search-input::placeholder {
    color: #64748b;
    font-weight: 400;
  }

  /* Bookmarks Grid */
  .section-label {
    align-self: flex-start;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #94a3b8;
    margin-bottom: 14px;
    padding-left: 4px;
  }

  .bookmarks-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }

  .bookmark-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #cbd5e1;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .bookmark-item:active {
    transform: scale(0.92);
  }

  .bookmark-circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(18, 27, 44, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    margin-bottom: 8px;
    transition: all 0.2s;
  }

  .bookmark-label {
    font-size: 11.5px;
    font-weight: 500;
    color: #cbd5e1;
    letter-spacing: -0.2px;
    text-align: center;
    line-height: 1.2;
  }

  /* Geometric art icons */
  .bm-art {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
  }

  .art-1 .q1 { background: #f97316; border-radius: 10px 2px 2px 2px; }
  .art-1 .q2 { background: #3b82f6; border-radius: 2px 10px 2px 2px; }
  .art-1 .q3 { background: #10b981; border-radius: 2px 2px 2px 10px; }
  .art-1 .q4 { background: #06b6d4; border-radius: 2px 2px 10px 2px; }

  .art-2 .q1 { background: #ef4444; border-radius: 10px 2px 2px 2px; }
  .art-2 .q2 { background: #f87171; border-radius: 2px 10px 2px 2px; }
  .art-2 .q3 { background: #f87171; border-radius: 2px 2px 2px 10px; }
  .art-2 .q4 { background: #ef4444; border-radius: 2px 2px 10px 2px; }

  .art-3 .q1 { background: #6366f1; border-radius: 10px 2px 2px 2px; }
  .art-3 .q2 { background: #8b5cf6; border-radius: 2px 10px 2px 2px; }
  .art-3 .q3 { background: #8b5cf6; border-radius: 2px 2px 2px 10px; }
  .art-3 .q4 { background: #6366f1; border-radius: 2px 2px 10px 2px; }

  .art-4 .q1 { background: #f59e0b; border-radius: 10px 2px 2px 2px; }
  .art-4 .q2 { background: #ec4899; border-radius: 2px 10px 2px 2px; }
  .art-4 .q3 { background: #8b5cf6; border-radius: 2px 2px 2px 10px; }
  .art-4 .q4 { background: #d946ef; border-radius: 2px 2px 10px 2px; }

  /* Feature cards banner */
  .feature-banner {
    width: 100%;
    margin-top: 28px;
    padding: 14px 16px;
    background: rgba(16, 24, 40, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .banner-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .banner-text {
    flex: 1;
  }

  .banner-title {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 2px;
  }

  .banner-desc {
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.3;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-aura"></div>
    <img src="logo.svg" alt="Sotizence Play Books Browser" class="app-logo">
  </div>

  <div class="title-text">Sotizence Play Books</div>
  <div class="badge-tag">
    <span class="badge-dot"></span>
    Auto Uploader v9.26 Active
  </div>

  <!-- Search Bar -->
  <div class="search-wrap">
    <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
      <div class="google-icon">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.27 21.43 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.02 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.57 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
      </div>
      <input type="text" id="queryInput" class="search-input" placeholder="Search or Enter URL" autofocus autocomplete="off">
    </form>
  </div>

  <div class="section-label">Quick Links</div>

  <!-- Bookmarks -->
  <div class="bookmarks-grid">
    <div onclick="navigateUrl('https://play.google.com/books/publish/u/0/')" class="bookmark-item">
      <div class="bookmark-circle">
        <div class="bm-art art-1">
          <div class="q1"></div><div class="q2"></div><div class="q3"></div><div class="q4"></div>
        </div>
      </div>
      <span class="bookmark-label">Partner Center</span>
    </div>

    <div onclick="navigateUrl('https://browserleaks.com/ip')" class="bookmark-item">
      <div class="bookmark-circle">
        <div class="bm-art art-2">
          <div class="q1"></div><div class="q2"></div><div class="q3"></div><div class="q4"></div>
        </div>
      </div>
      <span class="bookmark-label">BrowserLeaks</span>
    </div>

    <div onclick="navigateUrl('https://account.protonvpn.com')" class="bookmark-item">
      <div class="bookmark-circle">
        <div class="bm-art art-3">
          <div class="q1"></div><div class="q2"></div><div class="q3"></div><div class="q4"></div>
        </div>
      </div>
      <span class="bookmark-label">Proton VPN</span>
    </div>

    <div onclick="navigateUrl('https://play.google.com/store/books')" class="bookmark-item">
      <div class="bookmark-circle">
        <div class="bm-art art-4">
          <div class="q1"></div><div class="q2"></div><div class="q3"></div><div class="q4"></div>
        </div>
      </div>
      <span class="bookmark-label">Live Store</span>
    </div>
  </div>

  <!-- Banner -->
  <div class="feature-banner" style="cursor: pointer;" onclick="navigateUrl('https://play.google.com/books/publish/u/0/')">
    <div class="banner-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="banner-text">
      <div class="banner-title">📚 Auto Uploader Ready</div>
      <div class="banner-desc">Tap here to open Partner Center and start automatic book upload &amp; publishing.</div>
    </div>
  </div>
</div>

<script>
  function navigateUrl(url) {
    if (window.Android && window.Android.openUrl) {
      window.Android.openUrl(url);
    } else {
      window.location.href = url;
    }
  }

  function handleSearch(e) {
    e.preventDefault();
    const input = document.getElementById("queryInput");
    let val = (input.value || "").trim();
    if (!val) return;
    let target = "";
    if (/^[a-zA-Z]+:\/\//i.test(val)) {
      target = val;
    } else if (val.includes(".") && !val.includes(" ")) {
      target = "https://" + val;
    } else {
      target = "https://www.google.com/search?q=" + encodeURIComponent(val);
    }
    navigateUrl(target);
  }
</script>

</body>
</html>
