name: Build Gemini HD Studio (APK + Windows Setup)

# GitHub diye build: repo-te FULL project push kore Actions tab theke
# "Run workflow" chaple ekta dropdown asbe — all (APK + Windows dutoi),
# android (sudhu APK) ba windows (sudhu Windows) — jeta dorkar select
# kore Run. Windows artifact-e sudhu 2 ta file thakbe:
# GeminiHDStudio-Setup-1.0.0.exe (installer) ar GeminiHDStudio.exe.
# v* tag (jamon v1.0.0) push korle shob build hoye GitHub Release-eo jabe.
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Ki build korba?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Android Release APK (JDK 17)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Rename APK
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk GeminiHDStudio-v1.0.0-release.apk
          else
            cp build/app/outputs/flutter-apk/app-*-release.apk GeminiHDStudio-v1.0.0-release.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hd-studio-android-apk
          path: GeminiHDStudio-v1.0.0-release.apk
          retention-days: 90

      - name: Publish APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiHDStudio-v1.0.0-release.apk

  build-windows:
    name: Windows App + Setup .exe
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'windows' }}
    # windows-2022 badhyotamulok: windows-latest-e ekhon sudhu Visual
    # Studio 2026 thake, jeta Flutter 3.24 chene na (Signtech-e ei
    # problem-e build fail hoyechilo). windows-2022-te VS 2022 ache.
    runs-on: windows-2022
    steps:
      - name: Workflow version (v9 FIXED)
        run: echo "WORKFLOW FILE VERSION = v9-fixed (GeminiHDStudio.exe name fix applied)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Ensure NuGet on PATH (flutter_inappwebview Windows needs it)
        shell: pwsh
        run: |
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if (-not $nuget) {
            Write-Host "nuget not found - downloading nuget.exe..."
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\nuget" | Out-Null
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$env:RUNNER_TEMP\nuget\nuget.exe"
            "$env:RUNNER_TEMP\nuget" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "nuget.exe added to PATH"
          } else {
            Write-Host "nuget found: $($nuget.Source)"
          }

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage the app exe (v9 FIXED)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          if (!(Test-Path $rel)) { $rel = "build\windows\runner\Release" }
          Write-Host "Release folder contents:"
          Get-ChildItem $rel | Select-Object -ExpandProperty Name
          # Windows binary-er naam GeminiHDStudio.exe (windows/CMakeLists
          # BINARY_NAME) — Linux binary-er naam (gemini_hd_studio) na.
          $src = Join-Path $rel "GeminiHDStudio.exe"
          if (!(Test-Path $src)) {
            $any = Get-ChildItem "$rel\*.exe" | Select-Object -First 1
            if (-not $any) { Write-Error "No app exe FOUND in $rel"; exit 1 }
            $src = $any.FullName
          }
          Copy-Item $src "GeminiHDStudio.exe" -Force
          Get-Item "GeminiHDStudio.exe" | Select-Object Name, Length

      - name: Check installer script exists
        shell: pwsh
        run: |
          if (!(Test-Path "installer\gemini_hd_studio_setup.iss")) {
            Write-Error "installer/gemini_hd_studio_setup.iss NOT FOUND - repo-te installer folder soho FULL project upload koro (hidden .github folder soho)."
            exit 1
          }
          Write-Host "Installer script found OK"

      - name: Build installer (Inno Setup 6)
        shell: pwsh
        run: |
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc installer\gemini_hd_studio_setup.iss
          if (!(Test-Path "installer\Output\GeminiHDStudio-Setup-1.0.0.exe")) {
            Write-Error "Setup exe was NOT created - uporer ISCC log dekho."
            exit 1
          }
          Get-Item "installer\Output\GeminiHDStudio-Setup-1.0.0.exe" | Select-Object Name, Length

      - name: Upload Windows artifacts (sudhu Setup exe + app exe)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hd-studio-windows
          path: |
            installer/Output/GeminiHDStudio-Setup-1.0.0.exe
            GeminiHDStudio.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish Windows files to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/GeminiHDStudio-Setup-1.0.0.exe
            GeminiHDStudio.exe
