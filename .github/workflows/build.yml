name: Build Signtech File Sharing (Windows EXE)

# Builds Signtech File Sharing for Windows with Flutter (Dart).
# Same language / toolchain as the user's TeamDrive workflow:
# Flutter 3.24.x, windows-2022 runner, Inno Setup installer.
#
# Triggers on every push to main and on manual dispatch.
# No WebView anywhere — 100% Flutter widgets, direct LAN API calls
# (dart:io HttpServer on the Printer PC, HttpClient on Designer PC).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows EXE
    # windows-2022 carries complete VS2019 + VS2022 installs with the C++
    # workload — the combo Flutter 3.24's Windows build expects. windows-latest
    # (2025) only ships VS2022 and trips CMake's VS2019 generator lookup.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      # The repo ships only the Dart side (lib/, pubspec.yaml). Generate the
      # Windows platform folder with the official "add a platform" flow so the
      # exact Flutter version in CI produces its own version-matched CMake
      # project. Existing lib/, pubspec.yaml and assets are left untouched.
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.signtech --project-name signtech_file_sharing .

      # Smaller default window: Flutter's template opens at 1280x720,
      # which nearly fills a 1366x768 shop PC. Open at 1080x680 instead.
      # The window stays resizable and maximizable — this is only the
      # size it opens at. Fails loudly if the template ever changes
      # the default line, so a big window can never slip through.
      - name: Smaller default window size (1080x680)
        shell: pwsh
        run: |
          $path = "windows/runner/main.cpp"
          $text = Get-Content $path -Raw
          if ($text -notmatch "Win32Window::Size size\(1280, 720\);") {
            throw "main.cpp does not contain the expected 1280x720 default — template changed, update this step"
          }
          $text = $text -replace "Win32Window::Size size\(1280, 720\);", "Win32Window::Size size(1080, 680);"
          Set-Content $path $text -NoNewline
          Select-String -Path $path -Pattern "Win32Window::Size size"

      # flutter create also drops in a default counter-app widget test that
      # references a non-existent MyApp class — it breaks analyze, delete it.
      - name: Remove default widget test
        run: rm -Force test/widget_test.dart

      # Use the user's printer logo as the Windows app icon (EXE + taskbar +
      # Start menu) instead of Flutter's default icon.
      - name: Use the Signtech logo as the Windows app icon
        shell: pwsh
        run: Copy-Item packaging/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Set up the MSVC compiler environment (INCLUDE/LIB/PATH) before CMake
      # runs — the standard prerequisite for Flutter Windows builds on CI.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release EXE
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (setup.exe)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split ':')[1].Trim().Split('+')[0] })
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAPP_VERSION=$ver" packaging/windows/signtech_file_sharing.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: signtech-file-sharing-windows-installer
          path: installer/SigntechFileSharing-Setup-*.exe
          if-no-files-found: error

      - name: Zip the Windows release folder (portable)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split ':')[1].Trim().Split('+')[0] })
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "signtech-file-sharing-windows-portable-$ver.zip" -Force

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: signtech-file-sharing-windows-portable
          path: signtech-file-sharing-windows-portable-*.zip
          if-no-files-found: error
