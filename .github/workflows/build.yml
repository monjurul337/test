name: Build Sotizence Play Books Browser (Windows & Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (Electron Installer)
  # ==========================================
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Windows Installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SotizencePlayBooksBrowser-Windows-Setup
          path: dist/*.exe
          retention-days: 30

  # ==========================================
  # ANDROID BUILD (Kotlin Release APK, JDK 17)
  # ==========================================
  build-android:
    name: Build Android APK (Kotlin / JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper JAR
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Generate CI Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias sotizence \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sotizence123 \
            -keypass sotizence123 \
            -dname "CN=Sotizence, OU=PlayBooks, O=Sotizence, L=Global, S=Global, C=US"

      - name: Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: sotizence123
          KEY_ALIAS: sotizence
          KEY_PASSWORD: sotizence123
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/SotizencePlayBooksBrowser-v1.0.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SotizencePlayBooksBrowser-Android-APK
          path: release-apk/*.apk
          retention-days: 30

  # ==========================================
  # GITHUB RELEASE (Tag builds only: attaches both .exe and .apk)
  # ==========================================
  release:
    name: Publish Release (Windows & Android)
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SotizencePlayBooksBrowser-Windows-Setup
          path: release-assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SotizencePlayBooksBrowser-Android-APK
          path: release-assets/

      - name: Create GitHub Release and Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
