name: Build Moxixo Antidetect Browser

# Build by hand: GitHub repo -> Actions tab -> this workflow -> Run workflow
# Build + publish a Release: push a tag like v1.0.1
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot dpkg

      - name: Install dependencies
        run: npm install

      - name: Download wireproxy (WireGuard VPN engine)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p bin
          case "${{ matrix.os }}" in
            windows-latest) ASSET=wireproxy_windows_amd64.tar.gz ;;
            macos-latest)   ASSET=wireproxy_darwin_all.tar.gz ;;
            *)              ASSET=wireproxy_linux_amd64.tar.gz ;;
          esac
          curl -sL -o /tmp/wp.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/$ASSET"
          tar xzf /tmp/wp.tar.gz -C bin
          ls -la bin

      - name: Build installers (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates configured: skip mac notarization checks
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moxixo-antidetect-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
          if-no-files-found: warn
          retention-days: 30
