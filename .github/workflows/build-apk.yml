name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK (JDK 17 + Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐘 Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🔑 Generate Deterministic Release Keystore (v1 & v2 Signing)
        run: |
          mkdir -p android-app/app
          if [ ! -f android-app/app/release.keystore ]; then
            echo "Generating release keystore with RSA 2048 and 25-year validity..."
            keytool -genkey -v \
              -keystore android-app/app/release.keystore \
              -storepass visabot123 \
              -alias visabot \
              -keypass visabot123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=IVAC Visa Bot, OU=Android, O=VisaBot, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: 🛡️ Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: 🚀 Build Signed Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: 🔍 Locate, Verify & Stage Release APK
        id: stage_apk
        run: |
          mkdir -p release-output
          APK_PATH=$(find android-app/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          # Verify APK signing schemes (v1 + v2) using Android build-tools apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying signature with $APKSIGNER:"
            "$APKSIGNER" verify --verbose "$APK_PATH" || true
          fi

          cp "$APK_PATH" release-output/IVAC-VisaBot-release.apk
          ls -la release-output/

      - name: 📦 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IVAC-VisaBot-Release-APK
          path: release-output/IVAC-VisaBot-release.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/IVAC-VisaBot-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
