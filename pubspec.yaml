name: mh_motion_studio
description: MH Motion GPU Shader Studio with Anti-Detect Chromium, Gemini Cookie Metadata, and Adobe Stock Auto-Submit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  video_thumbnail: ^0.5.3
  video_player: ^2.9.2
  gal: ^2.3.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
