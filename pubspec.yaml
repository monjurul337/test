name: gemini_hd_studio
description: "Zedge Studio — Wallpaper Set Designer, AI Metadata & Panel Uploader (Android + Windows). Flutter port of the Gemini HD Studio v2.5.3 Chrome extension."
publish_to: 'none'
version: 1.42.0+42

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # No WebView plugin: sign-in + browsing use the built-in Firefox
  # engine (Android, GeckoView) and the app's own Chrome/Edge
  # window (Windows). flutter_inappwebview was removed in v17 —
  # it was unused in lib/ and its old Android module risked
  # breaking the AGP 8.9 / Kotlin 2.3 toolchain.
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  image: ^4.2.0
  archive: ^3.6.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
