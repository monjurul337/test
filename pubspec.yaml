name: gemini_hd_studio
description: "Gemini HD Studio — Wallpaper Set Designer, AI Metadata & Panel Uploader (Android + Windows). Flutter port of the Gemini HD Studio v2.5.3 Chrome extension."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  image: ^4.2.0
  archive: ^3.6.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
