name: gemini_hd_studio
description: "Gemini HD Studio — Wallpaper Set Designer, AI Metadata & Panel Uploader (Android + Windows). Flutter port of the Gemini HD Studio v2.5.3 Chrome extension."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # WebView for the Gemini login screen. Android side is Kotlin
  # (flutter_inappwebview_android), Windows side uses WebView2.
  # Same plugin the user's Signtech app already builds with on
  # Flutter 3.24.5 — pinned to the 6.1.x line on purpose.
  flutter_inappwebview: 6.1.5
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  image: ^4.2.0
  archive: ^3.6.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
