[versions]
agp = "8.7.3"
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "35"
androidx-activity = "1.9.3"
androidx-core = "1.15.0"
androidx-lifecycle = "2.8.4"
androidx-security = "1.1.0-alpha06"
androidx-webkit = "1.12.1"
compose-multiplatform = "1.7.3"
coroutines = "1.9.0"
kotlin = "2.1.0"
ktor = "3.0.3"
kcef = "2024.04.20.4"
serialization = "1.7.3"
datastore = "1.1.1"
okio = "3.9.1"
wireguard-android = "1.0.20230706"
slf4j = "2.0.16"

[libraries]
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime  = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.4" }
androidx-lifecycle-viewmodel= { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.4" }
androidx-security-crypto    = { module = "androidx.security:security-crypto", version.ref = "androidx-security" }
androidx-webkit             = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
datastore-preferences       = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
kcef                        = { module = "dev.datlag:kcef", version.ref = "kcef" }
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core            = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp          = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-java            = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-content         = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okio                        = { module = "com.squareup.okio:okio", version.ref = "okio" }
slf4j-simple                = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
wireguard-tunnel            = { module = "com.wireguard.android:tunnel", version.ref = "wireguard-android" }

[plugins]
androidApplication      = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform    = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform     = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
